service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  assumed_requests_28d: 10000
  error_budget_requests_28d: 50
  baseline_reference:
    latency_p50_ms: 152.0
    latency_p95_ms: 1172.0
    ttft_p95_ms: 50.0
    error_rate_pct: 0.0
    retrieval_success_rate_pct: 100.0
  note: >
    Dựa trên baseline thực tế của hệ thống (Latency P50 = 152ms, Latency P95 = 1172ms ~ 2126ms, TTFT P95 = 50ms, Error rate = 0%, Retrieval success = 100%),
    ngưỡng latency_ms <= 3000ms tạo vùng đệm an toàn (~1.4x–2.5x so với P95 bình thường) nhưng vẫn phát hiện sớm khi RAG bị chậm (ví dụ rag_slow làm latency vọt lên >2600ms–3000ms) hoặc lỗi tool_fail.
    Với SLO 99.5% trong cửa sổ 28 ngày (error budget = 0.5%): nếu tổng lưu lượng là 10,000 requests thì hệ thống chỉ được phép có tối đa 10,000 * 0.5% = 50 requests bị lỗi (request_failed) hoặc có latency_ms > 3000ms.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
