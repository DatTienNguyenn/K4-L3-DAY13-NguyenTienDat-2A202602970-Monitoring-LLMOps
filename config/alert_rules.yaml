alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(response_sent.latency_ms) > 3000 or p95(response_sent.ttft_ms) > 500'
    duration: 5m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602970
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRateOrRetrievalDegradation
    severity: critical
    condition: 'error_rate_pct > 2 or tool_success_rate_pct < 90'
    duration: 3m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602970
    runbook: docs/alerts.md#alert-2
  - name: CostSpikeOrQualityDrop
    severity: warning
    condition: 'sum_60m(response_sent.cost_usd) > 2.5 or sum_60m(response_sent.tokens_out) > 50000 or mean(response_sent.quality_score) < 0.75'
    duration: 10m
    type: symptom-based
    channel: slack:#k4-l3b-alerts
    owner: student-2A202602970
    runbook: docs/alerts.md#alert-3
